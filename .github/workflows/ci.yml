name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Validate packaging scripts
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/build-dmg.sh
          plutil -lint packaging/Info.plist
      - run: swift build

  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: swift test

  package:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build local universal DMG
        env:
          APP_VERSION: 0.0.0
          APP_BUILD: 0
        run: bash scripts/build-dmg.sh --local

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Show Xcode and SDK versions
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Validate packaging scripts
        run: |
          bash -n scripts/build-app.sh
          bash -n scripts/build-dmg.sh
          bash -n scripts/generate-appcast.sh
          bash -n scripts/setup-sparkle.sh
          plutil -lint packaging/Info.plist
      - name: Validate translations
        run: python3 scripts/localization.py --check
      - run: swift build

  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: swift test
      - name: Test update packaging rules
        run: python3 -m unittest discover -s Tests/Packaging -v

  package:
    needs: [build, test]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build local universal DMG
        env:
          APP_VERSION: 0.0.0
          APP_BUILD: 0
        run: bash scripts/build-dmg.sh --local
